server:
  port: ${SERVER_PORT:8240}
  forward-headers-strategy: framework
  servlet:
    context-path: /api/v1
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: ms-geolocalizacion
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:styleradar_geolocation}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      idle-timeout: 60000
      initialization-fail-timeout: ${DB_INIT_FAIL_TIMEOUT:60000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    openfeign:
      client:
        config:
          ms-tiendas:
            connect-timeout: 5000
            read-timeout: 10000
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
      verify-hostname: ${RABBITMQ_SSL_VERIFY_HOSTNAME:true}
    listener:
      simple:
        auto-startup: ${RABBITMQ_LISTENER_ENABLED:false}
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2

styleradar:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:styleradar.exchange}
    dlx: ${RABBITMQ_DLX:styleradar.dlx}
    dlq: ${RABBITMQ_DLQ:styleradar.geolocalizacion.dlq}
    dlq-routing-key: ${RABBITMQ_DLQ_ROUTING_KEY:styleradar.geolocalizacion.error}
    queues:
      almacenes: ${RABBITMQ_QUEUE_ALMACENES:styleradar.geolocalizacion.almacen.q}
      fundaciones: ${RABBITMQ_QUEUE_FUNDACIONES:styleradar.geolocalizacion.fundacion.q}
      fundaciones-estado: ${RABBITMQ_QUEUE_FUNDACIONES_ESTADO:styleradar.geolocalizacion.fundacion-estado.q}
    routing-keys:
      almacen-registrado: ${RABBITMQ_RK_ALMACEN_REGISTRADO:styleradar.tiendas.almacen.registrado}
      almacen-actualizado: ${RABBITMQ_RK_ALMACEN_ACTUALIZADO:styleradar.tiendas.almacen.actualizado}
      fundacion-registrada: ${RABBITMQ_RK_FUNDACION_REGISTRADA:styleradar.tiendas.fundacion.registrada}
      fundacion-actualizada: ${RABBITMQ_RK_FUNDACION_ACTUALIZADA:styleradar.tiendas.fundacion.actualizada}
      fundacion-desactivada: ${RABBITMQ_RK_FUNDACION_DESACTIVADA:foundation.deactivated}
      fundacion-reactivada: ${RABBITMQ_RK_FUNDACION_REACTIVADA:foundation.reactivated}

tiendas:
  url: ${TIENDAS_URL:http://localhost:8140/api/v1}
  carga:
    habilitada: ${TIENDAS_CARGA_HABILITADA:true}
    intervalo: ${TIENDAS_CARGA_INTERVALO:PT30M}
    reintento: ${TIENDAS_CARGA_REINTENTO:PT2M}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  health:
    rabbit:
      enabled: ${RABBITMQ_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health, info
